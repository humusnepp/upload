name: RenPyPlayer
options:
  bundleIdPrefix: com.renpyplayer
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  objectVersion: "56"
  createIntermediateGroups: true
  ALWAYS_SEARCH_USER_PATHS: NO

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

targets:
  RenPyPlayer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: RenPyPlayer
        excludes:
          - "**/*.md"
          - "**/*.plist"
          - "Engine/base/**"
      - path: RenPyPlayer/Engine/base
        type: folder
        optional: true
    info:
      path: RenPyPlayer/Info.plist
      properties:
        UILaunchScreen_Generation: YES
        UILaunchStoryboardName: LaunchScreen
        UIRequiresFullScreen: YES
    settings:
      base:
        PRODUCT_NAME: RenPyPlayer
        PRODUCT_BUNDLE_IDENTIFIER: com.renpyplayer.RenPyPlayer
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: RenPyPlayer/Engine/RenPyBridge.h
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ALWAYS_SEARCH_USER_PATHS: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        LIBRARY_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/RenPyPlayer/Engine/libs"
        FRAMEWORK_SEARCH_PATHS:
          - "$(inherited)"
          - "$(SRCROOT)/RenPyPlayer/Engine/Frameworks"
        OTHER_LDFLAGS:
          - "-lrenpython"
          - "-lrenpy"
          - "-lpython3.9"
          - "-lavformat"
          - "-lavcodec"
          - "-lswscale"
          - "-lswresample"
          - "-lavutil"
          - "-lSDL2_image"
          - "-lSDL2"
          - "-lavif"
          - "-laom"
          - "-lyuv"
          - "-lturbojpeg"
          - "-lpng16"
          - "-lwebp"
          - "-lharfbuzz"
          - "-lbrotlidec"
          - "-lfribidi"
          - "-lfreetype"
          - "-lffi"
          - "-lssl"
          - "-lcrypto"
          - "-llzma"
          - "-lbz2"
          - "-lz"
          - "-framework Metal"
          - "-framework OpenGLES"
          - "-framework AVFoundation"
          - "-framework AudioToolbox"
          - "-framework CoreAudio"
          - "-framework CoreGraphics"
          - "-framework CoreMotion"
          - "-framework GameController"
          - "-framework QuartzCore"
          - "-framework UIKit"
          - "-framework Foundation"
    dependencies:
      - package: ZIPFoundation
      - framework: RenPyPlayer/Engine/Frameworks/MetalANGLE.xcframework
        embed: true
