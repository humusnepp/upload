name: RenPyPlayer
options:
  bundleIdPrefix: com.renpyplayer
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"       # recognized token in XcodeGen's version map
  objectVersion: "56"         # force pbxproj format 56 (Xcode 13-15); prevents format-77 generation on latest XcodeGen
  createIntermediateGroups: true

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

targets:
  RenPyPlayer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: RenPyPlayer
        excludes:
          - "**/*.md"
    info:
      path: RenPyPlayer/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.renpyplayer.RenPyPlayer
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_OBJC_BRIDGING_HEADER: "RenPyPlayer/Engine/RenPyBridge.h"
        # Code signing — overridden in CI via xcodebuild args
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - package: ZIPFoundation
