name: RenPyPlayer
options:
  bundleIdPrefix: com.renpyplayer
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15.0"
  objectVersion: "56"
  createIntermediateGroups: true
  ALWAYS_SEARCH_USER_PATHS: NO

packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

targets:
  RenPyPlayer:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: RenPyPlayer
        excludes:
          - "**/*.md"
          - "**/*.plist"
    info:
      path: RenPyPlayer/Info.plist
    settings:
      base:
        PRODUCT_NAME: RenPyPlayer
        PRODUCT_BUNDLE_IDENTIFIER: com.renpyplayer.RenPyPlayer
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_BITCODE: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ALWAYS_SEARCH_USER_PATHS: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
    dependencies:
      - package: ZIPFoundation
