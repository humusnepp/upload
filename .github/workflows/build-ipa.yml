name: Build IPA (Unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SCHEME: RenPyPlayer
  PROJECT: RenPyPlayer/RenPyPlayer.xcodeproj
  DERIVED_DATA: build/DerivedData
  IPA_DIR: build/ipa

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14   # Ships with Xcode 15.4

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Select Xcode 15.4 ──────────────────────────────────────────────
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      # ── 3. Install XcodeGen 2.41.0 (pinned — last release using objectVersion 56) ──
      - name: Install XcodeGen 2.41.0
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.41.0/xcodegen.zip \
            -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen_dir
          # The zip nests the binary inside a subdirectory — find it by type
          XCODEGEN_BIN=$(find /tmp/xcodegen_dir -name "xcodegen" -type f | head -1)
          echo "Found binary at: $XCODEGEN_BIN"
          sudo cp "$XCODEGEN_BIN" /usr/local/bin/xcodegen
          xcodegen version

      # ── 3b. Install xcpretty for cleaner build logs ────────────────────────
      - name: Install xcpretty
        run: gem install xcpretty --no-document

      # ── 4. Generate .xcodeproj from project.yml ────────────────────────────
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: RenPyPlayer

      # ── 4b. Verify generated project format ───────────────────────────────
      - name: Verify project objectVersion (must be ≤ 56 for Xcode 15.4)
        run: |
          OBJ_VER=$(grep -m1 'objectVersion' RenPyPlayer/RenPyPlayer.xcodeproj/project.pbxproj \
            | grep -oE '[0-9]+')
          echo "Generated objectVersion: $OBJ_VER"
          if [ "$OBJ_VER" -gt 56 ]; then
            echo "ERROR: objectVersion $OBJ_VER is too new for Xcode 15.4 (max 56)"
            exit 1
          fi

      # ── 5. Resolve SPM packages ────────────────────────────────────────────
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -derivedDataPath "${{ env.DERIVED_DATA }}"

      # ── 6. Build for generic iOS device (unsigned) ─────────────────────────
      - name: Build (unsigned, generic/platform=iOS)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${{ env.DERIVED_DATA }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcpretty

      # ── 6b. Show DerivedData tree (debug) ─────────────────────────────────
      - name: List DerivedData build products
        if: always()
        run: find "${{ env.DERIVED_DATA }}" -name "*.app" -o -name "*.o" -maxdepth 8 2>/dev/null | head -40 || true

      # ── 7. Package .app → .ipa ─────────────────────────────────────────────
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          # Search broadly — path may vary by Xcode/DerivedData layout
          APP_PATH=$(find "${{ env.DERIVED_DATA }}" \
            -name "RenPyPlayer.app" -type d \
            | head -1)

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: RenPyPlayer.app not found under ${{ env.DERIVED_DATA }}"
            find "${{ env.DERIVED_DATA }}" -maxdepth 8 -name "*.app" || true
            exit 1
          fi

          echo "Found app at: $APP_PATH"
          mkdir -p "${{ env.IPA_DIR }}/Payload"
          cp -r "$APP_PATH" "${{ env.IPA_DIR }}/Payload/"
          cd "${{ env.IPA_DIR }}"
          zip -r "RenPyPlayer-unsigned.ipa" Payload/
          echo "IPA created: $(du -sh RenPyPlayer-unsigned.ipa)"

      # ── 8. Upload IPA artifact ─────────────────────────────────────────────
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RenPyPlayer-unsigned-ipa
          path: ${{ env.IPA_DIR }}/RenPyPlayer-unsigned.ipa
          retention-days: 30
