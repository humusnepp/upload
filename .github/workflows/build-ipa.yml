name: Build IPA (Unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  SCHEME: RenPyPlayer
  PROJECT: RenPyPlayer/RenPyPlayer.xcodeproj
  DERIVED_DATA: build/DerivedData
  IPA_DIR: build/ipa

jobs:
  build-ipa:
    name: Build Unsigned IPA
    runs-on: macos-14   # Ships with Xcode 15.4

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Select Xcode 15.4 ──────────────────────────────────────────────
      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      # ── 3. Install XcodeGen 2.41.0 (pinned — last release using objectVersion 56) ──
      - name: Install XcodeGen 2.41.0
        run: |
          curl -L https://github.com/yonaskolb/XcodeGen/releases/download/2.41.0/xcodegen.zip \
            -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen_dir
          # The zip nests the binary inside a subdirectory — find it by type
          XCODEGEN_BIN=$(find /tmp/xcodegen_dir -name "xcodegen" -type f | head -1)
          echo "Found binary at: $XCODEGEN_BIN"
          sudo cp "$XCODEGEN_BIN" /usr/local/bin/xcodegen
          xcodegen version

      # ── 3b. Install xcpretty for cleaner build logs ────────────────────────
      - name: Install xcpretty
        run: gem install xcpretty --no-document

      # ── 3c. Download and stage Ren'Py iOS SDK & prebuilt libraries ─────────
      - name: Download and stage Ren'Py iOS SDK
        run: |
          set -e
          echo "Fetching Ren'Py iOS support package (renios)..."
          curl -L --retry 3 "https://www.renpy.org/dl/8.3.4/renpy-8.3.4-renios.zip" -o /tmp/renios.zip
          mkdir -p /tmp/renios
          unzip -q /tmp/renios.zip -d /tmp/renios

          echo "Staging static libraries and MetalANGLE xcframework..."
          mkdir -p RenPyPlayer/RenPyPlayer/Engine/libs
          mkdir -p RenPyPlayer/RenPyPlayer/Engine/Frameworks
          cp -r /tmp/renios/renios/prototype/prebuilt/release/*.a RenPyPlayer/RenPyPlayer/Engine/libs/
          cp -r /tmp/renios/renios/prototype/Frameworks/MetalANGLE.xcframework RenPyPlayer/RenPyPlayer/Engine/Frameworks/

          echo "Staging Ren'Py iOS runtime Objective-C support files (Log.m, VideoPlayer.m, IAPHelper.m)..."
          cp -f /tmp/renios/renios/prototype/Log.m RenPyPlayer/RenPyPlayer/Engine/
          cp -f /tmp/renios/renios/prototype/VideoPlayer.m RenPyPlayer/RenPyPlayer/Engine/
          cp -f /tmp/renios/renios/prototype/IAPHelper.m RenPyPlayer/RenPyPlayer/Engine/

          echo "Fetching Ren'Py 8.2.3 SDK (Python 3.9 engine & stdlib)..."
          curl -L --retry 3 "https://www.renpy.org/dl/8.2.3/renpy-8.2.3-sdk.zip" -o /tmp/renpy-sdk.zip
          mkdir -p /tmp/renpy-sdk
          unzip -q /tmp/renpy-sdk.zip -d /tmp/renpy-sdk

          echo "Staging core Ren'Py Python files and stdlib..."
          mkdir -p RenPyPlayer/RenPyPlayer/Engine/base
          mkdir -p RenPyPlayer/RenPyPlayer/Engine/base/lib
          mkdir -p RenPyPlayer/RenPyPlayer/Engine/lib

          # Copy Ren'Py python packages
          cp -r /tmp/renpy-sdk/renpy-8.2.3-sdk/renpy RenPyPlayer/RenPyPlayer/Engine/base/
          cp -r /tmp/renpy-sdk/renpy-8.2.3-sdk/renpy/common RenPyPlayer/RenPyPlayer/Engine/base/common

          # Ensure LogFile handles pickling gracefully
          python3 -c "p='RenPyPlayer/RenPyPlayer/Engine/base/renpy/log.py'; s=open(p).read(); open(p,'w').write(s.replace('class LogFile(object):', 'class LogFile(object):\n    def __getstate__(self):\n        d=dict(self.__dict__); d[\x27file\x27]=None; return d\n    def __setstate__(self,d):\n        self.__dict__.update(d)\n        if renpy.ios: self.file=real_stdout\n'))"
          rm -f RenPyPlayer/RenPyPlayer/Engine/base/renpy/log.pyc

          # Copy official renpy.py entry point as main.py
          cp /tmp/renpy-sdk/renpy-8.2.3-sdk/renpy.py RenPyPlayer/RenPyPlayer/Engine/base/main.py

          # Copy Python 3.9 standard library
          cp -r /tmp/renpy-sdk/renpy-8.2.3-sdk/lib/python3.9 RenPyPlayer/RenPyPlayer/Engine/base/lib/python3.9
          cp -r /tmp/renpy-sdk/renpy-8.2.3-sdk/lib/python3.9 RenPyPlayer/RenPyPlayer/Engine/lib/python3.9

          # Create python39.zip for zipped import
          (cd /tmp/renpy-sdk/renpy-8.2.3-sdk/lib/python3.9 && zip -rq /tmp/python39.zip .)
          cp /tmp/python39.zip RenPyPlayer/RenPyPlayer/Engine/base/lib/python39.zip
          cp /tmp/python39.zip RenPyPlayer/RenPyPlayer/Engine/lib/python39.zip

          echo "Staged libraries:"
          ls -lh RenPyPlayer/RenPyPlayer/Engine/libs/

      # ── 4. Generate .xcodeproj from project.yml ────────────────────────────
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
        working-directory: RenPyPlayer

      # ── 4b. Verify generated project format ───────────────────────────────
      - name: Verify project objectVersion (must be ≤ 56 for Xcode 15.4)
        run: |
          OBJ_VER=$(grep -m1 'objectVersion' RenPyPlayer/RenPyPlayer.xcodeproj/project.pbxproj \
            | grep -oE '[0-9]+')
          echo "Generated objectVersion: $OBJ_VER"
          if [ "$OBJ_VER" -gt 56 ]; then
            echo "ERROR: objectVersion $OBJ_VER is too new for Xcode 15.4 (max 56)"
            exit 1
          fi

      # ── 5. Resolve SPM packages ────────────────────────────────────────────
      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -derivedDataPath "${{ env.DERIVED_DATA }}"

      # ── 6. Build for generic iOS device (unsigned) ─────────────────────────
      - name: Build (unsigned, generic/platform=iOS)
        run: |
          set -o pipefail
          xcodebuild build \
            -project "${{ env.PROJECT }}" \
            -scheme "${{ env.SCHEME }}" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "${{ env.DERIVED_DATA }}" \
            ALWAYS_SEARCH_USER_PATHS=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            | xcpretty

      # ── 6b. Show DerivedData tree (debug) ─────────────────────────────────
      - name: List DerivedData build products
        if: always()
        run: find "${{ env.DERIVED_DATA }}" -name "*.app" -o -name "*.o" -maxdepth 8 2>/dev/null | head -40 || true

      # ── 7. Package .app → .ipa ─────────────────────────────────────────────
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          # Find the final .app product
          APP_PATH=$(find "${{ env.DERIVED_DATA }}/Build/Products" -name "RenPyPlayer.app" -type d 2>/dev/null | head -1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find "${{ env.DERIVED_DATA }}" -name "RenPyPlayer.app" -type d | head -1)
          fi

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: RenPyPlayer.app not found under ${{ env.DERIVED_DATA }}"
            find "${{ env.DERIVED_DATA }}" -maxdepth 8 -name "*.app" || true
            exit 1
          fi

          echo "Found app at: $APP_PATH"
          echo "=== App Bundle Contents ==="
          ls -la "$APP_PATH"
          if [ -d "$APP_PATH/Frameworks" ]; then
            echo "=== Frameworks Contents ==="
            ls -la "$APP_PATH/Frameworks"
          fi
          echo "=== Info.plist in App ==="
          plutil -p "$APP_PATH/Info.plist" || true

          # Ad-hoc sign embedded frameworks and app bundle (prevents dyld code signature crash on sideloaded apps)
          if [ -d "$APP_PATH/Frameworks" ]; then
            for fw in "$APP_PATH/Frameworks"/*.framework; do
              if [ -d "$fw" ]; then
                echo "Ad-hoc signing framework: $fw"
                codesign --force --deep --sign - --timestamp=none "$fw" || true
              fi
            done
          fi
          echo "Ad-hoc signing main app bundle..."
          codesign --force --deep --sign - --timestamp=none "$APP_PATH" || true

          mkdir -p "${{ env.IPA_DIR }}/Payload"
          cp -r "$APP_PATH" "${{ env.IPA_DIR }}/Payload/"
          cd "${{ env.IPA_DIR }}"
          zip -r "RenPyPlayer-unsigned.ipa" Payload/
          echo "IPA created: $(du -sh RenPyPlayer-unsigned.ipa)"

      # ── 8. Upload IPA artifact ─────────────────────────────────────────────
      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: RenPyPlayer-unsigned-ipa
          path: ${{ env.IPA_DIR }}/RenPyPlayer-unsigned.ipa
          retention-days: 30
